<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login or create your VELRON account. Join the VELRON Club.">
  <title>Login — VELRON</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body class="login-page">

  <!-- Login Split Layout -->
  <div class="login-split">

    <!-- Left: Visual Panel -->
    <div class="login-visual">
      <img
        src="https://images.pexels.com/photos/1598507/pexels-photo-1598507.jpeg?auto=compress&cs=tinysrgb&w=800"
        alt="VELRON — Live The Vision"
        class="login-visual-img"
        loading="eager"
      >
      <div class="login-visual-overlay"></div>
      <div class="login-visual-content">
        <a href="index.html" class="login-visual-logo">VELRON</a>
        <blockquote class="login-visual-quote">
          "Style is not just what you wear, it's how you live."
        </blockquote>
        <p class="login-visual-author">— VELRON, 2026</p>
      </div>
    </div>

    <!-- Right: Form Panel -->
    <div class="login-form-panel">
      <div class="login-form-inner">

        <!-- Auth Tabs -->
        <div class="auth-tabs" role="tablist" aria-label="Authentication options">
          <button
            class="auth-tab auth-tab--active"
            data-auth="login"
            role="tab"
            aria-selected="true"
            aria-controls="login-form"
            id="tab-login"
          >Sign In</button>
          <button
            class="auth-tab"
            data-auth="register"
            role="tab"
            aria-selected="false"
            aria-controls="register-form"
            id="tab-register"
          >Create Account</button>
        </div>

        <!-- ========================= -->
        <!-- LOGIN FORM                -->
        <!-- ========================= -->
        <div
          id="login-form"
          class="login-form auth-form"
          data-form-type="login"
          role="tabpanel"
          aria-labelledby="tab-login"
        >
          <div class="auth-form-header">
            <h1 class="auth-form-title">Welcome Back</h1>
            <p class="auth-form-subtitle">Sign in to your VELRON account</p>
          </div>

          <form id="loginFormEl" novalidate>

            <!-- Email -->
            <div class="form-group">
              <label class="form-label" for="loginEmail">Email Address</label>
              <input
                type="email"
                id="loginEmail"
                name="email"
                class="form-input"
                placeholder="you@example.com"
                autocomplete="email"
                data-validate="required,email"
              >
              <span class="form-error" role="alert"></span>
            </div>

            <!-- Password -->
            <div class="form-group">
              <label class="form-label" for="loginPassword">Password</label>
              <div class="input-password-wrapper">
                <input
                  type="password"
                  id="loginPassword"
                  name="password"
                  class="form-input"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  data-validate="required,minLength:6"
                >
                <button
                  type="button"
                  class="password-toggle"
                  aria-label="Toggle password visibility"
                  data-target="loginPassword"
                >
                  <svg class="eye-icon eye-icon--show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-icon eye-icon--hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" style="display:none">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </button>
              </div>
              <span class="form-error" role="alert"></span>
            </div>

            <!-- Form Options -->
            <div class="form-options">
              <label class="form-checkbox-label">
                <input type="checkbox" name="rememberMe" class="form-checkbox" id="rememberMe">
                <span class="form-checkbox-custom" aria-hidden="true"></span>
                Remember me
              </label>
              <a href="#" class="form-forgot-link">Forgot Password?</a>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-primary btn-full auth-submit-btn">
              Sign In
            </button>

          </form>

          <!-- Auth Switch -->
          <p class="auth-switch">
            Don't have an account?
            <a href="#" class="auth-switch-link" data-switch-auth="register">Create one</a>
          </p>
        </div>

        <!-- ========================= -->
        <!-- REGISTER FORM             -->
        <!-- ========================= -->
        <div
          id="register-form"
          class="register-form auth-form"
          data-form-type="register"
          role="tabpanel"
          aria-labelledby="tab-register"
          style="display:none"
        >
          <div class="auth-form-header">
            <h1 class="auth-form-title">Create Account</h1>
            <p class="auth-form-subtitle">Join the VELRON Club</p>
          </div>

          <form id="registerFormEl" novalidate>

            <!-- Name Row -->
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="registerFirstName">First Name</label>
                <input
                  type="text"
                  id="registerFirstName"
                  name="firstName"
                  class="form-input"
                  placeholder="First name"
                  autocomplete="given-name"
                  data-validate="required,name"
                >
                <span class="form-error" role="alert"></span>
              </div>
              <div class="form-group">
                <label class="form-label" for="registerLastName">Last Name</label>
                <input
                  type="text"
                  id="registerLastName"
                  name="lastName"
                  class="form-input"
                  placeholder="Last name"
                  autocomplete="family-name"
                  data-validate="required,name"
                >
                <span class="form-error" role="alert"></span>
              </div>
            </div>

            <!-- Email -->
            <div class="form-group">
              <label class="form-label" for="registerEmail">Email Address</label>
              <input
                type="email"
                id="registerEmail"
                name="email"
                class="form-input"
                placeholder="you@example.com"
                autocomplete="email"
                data-validate="required,email"
              >
              <span class="form-error" role="alert"></span>
            </div>

            <!-- Password -->
            <div class="form-group">
              <label class="form-label" for="registerPassword">Password</label>
              <div class="input-password-wrapper">
                <input
                  type="password"
                  id="registerPassword"
                  name="password"
                  class="form-input"
                  placeholder="Minimum 8 characters"
                  autocomplete="new-password"
                  data-validate="required,minLength:8"
                >
                <button
                  type="button"
                  class="password-toggle"
                  aria-label="Toggle password visibility"
                  data-target="registerPassword"
                >
                  <svg class="eye-icon eye-icon--show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-icon eye-icon--hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" style="display:none">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </button>
              </div>
              <span class="form-error" role="alert"></span>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
              <label class="form-label" for="registerConfirmPassword">Confirm Password</label>
              <div class="input-password-wrapper">
                <input
                  type="password"
                  id="registerConfirmPassword"
                  name="confirmPassword"
                  class="form-input"
                  placeholder="Re-enter your password"
                  autocomplete="new-password"
                  data-validate="required,match:registerPassword"
                >
                <button
                  type="button"
                  class="password-toggle"
                  aria-label="Toggle confirm password visibility"
                  data-target="registerConfirmPassword"
                >
                  <svg class="eye-icon eye-icon--show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-icon eye-icon--hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" style="display:none">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </button>
              </div>
              <span class="form-error" role="alert"></span>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-primary btn-full auth-submit-btn">
              Create Account
            </button>

          </form>

          <!-- Auth Switch -->
          <p class="auth-switch">
            Already have an account?
            <a href="#" class="auth-switch-link" data-switch-auth="login">Sign in</a>
          </p>
        </div>

      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/slider.js"></script>
  <script src="js/form-validation.js"></script>

</body>
</html>
